<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="light-blue-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00A2FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="dark-blue-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0545C4" />
      <stop offset="100%" stop-color="#1A75FF" />
    </linearGradient>

    <linearGradient id="white-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>

  <g id="logo-mark">
    <!-- Left Leg of A (Light Blue) - Back -->
    <polygon points="155,800 265,800 505,200 395,200" 
             fill="url(#light-blue-grad)" 
             stroke="url(#light-blue-grad)" stroke-width="16" stroke-linejoin="round" />

    <!-- Middle Leg of A/V (Dark Blue) - Middle -->
    <polygon points="445,200 555,200 795,800 685,800" 
             fill="url(#dark-blue-grad)" 
             stroke="url(#dark-blue-grad)" stroke-width="16" stroke-linejoin="round" />

    <!-- Right Leg of V (White) - Front -->
    <polygon points="735,800 845,800 605,200 495,200" 
             fill="url(#white-grad)" 
             stroke="url(#white-grad)" stroke-width="16" stroke-linejoin="round" />

    <!-- "i" inside the A space -->
    <g id="letter-i">
      <rect x="453" y="460" width="44" height="280" rx="22" fill="url(#dark-blue-grad)" />
      <circle cx="475" cy="410" r="26" fill="url(#dark-blue-grad)" />
    </g>
  </g>
</svg>
