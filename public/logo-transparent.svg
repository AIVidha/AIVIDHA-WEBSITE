<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="left-arm-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0545C4" />
      <stop offset="100%" stop-color="#1A75FF" />
    </linearGradient>

    <linearGradient id="right-arm-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="fold-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
  </defs>

  <g id="logo-mark">
    <!-- Right Arm (White) -->
    <polygon points="680,800 840,800 660,200 500,200" fill="url(#right-arm-grad)" />

    <!-- Left Arm (Blue) -->
    <polygon points="160,800 320,800 500,200 340,200" fill="url(#left-arm-grad)" />

    <!-- Top Fold (Cyan) -->
    <polygon points="500,200 340,200 268,440" fill="url(#fold-grad)" />

    <!-- "i" inside -->
    <g id="letter-i">
      <rect x="470" y="460" width="60" height="340" rx="8" fill="url(#left-arm-grad)" />
      <circle cx="500" cy="370" r="30" fill="url(#fold-grad)" />
    </g>
  </g>
</svg>
