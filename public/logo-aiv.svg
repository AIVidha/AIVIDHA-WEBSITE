<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="left-arm-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0545C4" />
      <stop offset="100%" stop-color="#1A75FF" />
    </linearGradient>

    <linearGradient id="right-arm-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="fold-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>
  </defs>

  <g id="logo-mark">
    <!-- Right V Shape (White) -->
    <polygon points="410,170 590,800 730,800 910,170 770,170 660,555 550,170" fill="url(#right-arm-grad)" />

    <!-- Left A Shape (Blue) -->
    <polygon points="90,800 230,800 410,170 270,170" fill="url(#left-arm-grad)" />

    <!-- Top Fold (Cyan) -->
    <polygon points="410,170 270,170 190,450" fill="url(#fold-grad)" />

    <!-- "i" inside -->
    <g id="letter-i">
      <rect x="380" y="450" width="60" height="350" fill="url(#left-arm-grad)" />
      <circle cx="410" cy="350" r="30" fill="url(#left-arm-grad)" />
    </g>
  </g>
</svg>
